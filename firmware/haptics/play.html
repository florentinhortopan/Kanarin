<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kanarin haptic language</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #141414;
        --fg: #e8e8e8;
        --muted: #9a9a9a;
        --line: #2a2a2a;
        --fill: #1e1e1e;
        --accent: #6b9dff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font: 15px/1.45 ui-sans-serif, system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 32px 20px 64px;
      }
      h1 {
        font-size: 22px;
        font-weight: 600;
        margin: 0 0 8px;
      }
      p.lead {
        color: var(--muted);
        margin: 0 0 28px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-bottom: 16px;
      }
      button,
      select {
        font: inherit;
        background: var(--fill);
        color: var(--fg);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 8px 12px;
      }
      button.primary {
        background: var(--accent);
        color: #111;
        border-color: transparent;
      }
      .phrase {
        width: 100%;
        text-align: left;
        padding: 12px 14px;
      }
      .phrase.active {
        border-color: var(--accent);
      }
      .meta {
        display: block;
        color: var(--muted);
        font-size: 13px;
      }
      .spec {
        height: 88px;
        background: var(--fill);
        border: 1px solid var(--line);
        border-radius: 6px;
        position: relative;
        margin: 8px 0 0;
        overflow: hidden;
      }
      .spec svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .pair {
        font-size: 13px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Kanarin chirp language</h1>
      <p class="lead">
        Heard preview: real canary gestures — upsweeps, downsweeps, short trills
        — around 2–6 kHz. Felt hardware: the same envelopes at ~235 Hz (an LRA
        cannot sing). Off / idle / blue stay silent. Play on edges only.
      </p>
      <div class="row">
        <label>
          Mount
          <select id="profile">
            <option value="fridge">Fridge (gain 1.0)</option>
            <option value="wearable">Wearable (gain 0.55)</option>
          </select>
        </label>
        <label>
          Voice
          <select id="voice">
            <option value="heard">Heard (chirp)</option>
            <option value="felt">Felt (LRA 235 Hz)</option>
          </select>
        </label>
        <button class="primary" id="play" type="button">Play selected</button>
      </div>
      <p class="pair" id="pair"></p>
      <div class="spec" id="spec" aria-hidden="true"></div>
      <div id="list" style="margin-top: 20px; display: grid; gap: 8px"></div>
    </main>
    <script>
      const HZ_MIN = 1600;
      const HZ_MAX = 6200;
      const LANG = {
        lraHz: 235,
        profiles: { fridge: 1, wearable: 0.55 },
        phrases: [
          {
            id: "air",
            gesture: "contact double-cheep",
            pattern: "two rising chirps",
            meaning: "CO₂ / stuffy — open a window",
            light: "alert (red)",
            natural:
              "Two short upsweeps — the all-day contact call, not song.",
            notes: [
              { at: 0, dur: 110, amp: 0.7, hz0: 2600, hz1: 4000 },
              { at: 200, dur: 110, amp: 0.78, hz0: 2800, hz1: 4300 },
            ],
          },
          {
            id: "cook",
            gesture: "fast twitter trill",
            pattern: "four falling ticks",
            meaning: "VOC event — kitchen or chemistry",
            light: "alert (red)",
            natural:
              "Repeated downsweeps at ~13/s — a short trill, not Morse dots.",
            notes: [
              { at: 0, dur: 48, amp: 0.72, hz0: 4400, hz1: 2400 },
              { at: 78, dur: 48, amp: 0.8, hz0: 4300, hz1: 2300 },
              { at: 156, dur: 48, amp: 0.85, hz0: 4200, hz1: 2200 },
              { at: 234, dur: 48, amp: 0.78, hz0: 4100, hz1: 2200 },
            ],
          },
          {
            id: "both",
            gesture: "alarm descending verse",
            pattern: "two steep drops + falling whistle",
            meaning: "CO₂ and VOC agree — really air this",
            light: "alert (red)",
            natural:
              "Hard falling syllables — canary climax and passerine alarm shape.",
            notes: [
              { at: 0, dur: 70, amp: 0.88, hz0: 5200, hz1: 2800 },
              { at: 95, dur: 70, amp: 0.94, hz0: 5000, hz1: 2600 },
              { at: 200, dur: 280, amp: 1, hz0: 4400, hz1: 1800 },
            ],
          },
          {
            id: "clear",
            gesture: "soft downsweep whistle",
            pattern: "one falling whistle",
            meaning: "Recovering — use sparingly",
            light: "recovering (amber)",
            natural: "One quiet tonal fall — content, not alarm.",
            notes: [
              { at: 0, dur: 40, amp: 0.22, hz0: 3000, hz1: 3600 },
              { at: 48, dur: 240, amp: 0.34, hz0: 3600, hz1: 2100 },
            ],
          },
          {
            id: "dock",
            gesture: "greeting peck",
            pattern: "two high chips",
            meaning: "Charging started",
            light: "charging (amber pulse)",
            natural: "Two tiny high upsweeps — a social chip, not a verse.",
            notes: [
              { at: 0, dur: 36, amp: 0.42, hz0: 3800, hz1: 5200 },
              { at: 88, dur: 36, amp: 0.42, hz0: 4000, hz1: 5400 },
            ],
          },
        ],
      };

      let selected = "air";
      let ctx;

      function duration(phrase) {
        return Math.max(...phrase.notes.map((n) => n.at + n.dur));
      }

      function yHz(hz) {
        const t = (hz - HZ_MIN) / (HZ_MAX - HZ_MIN);
        return 1 - Math.min(1, Math.max(0, t));
      }

      function drawSpec(phrase) {
        const el = document.getElementById("spec");
        const total = Math.max(duration(phrase), 600);
        const w = 720;
        const h = 88;
        const lines = phrase.notes
          .map((n) => {
            const x0 = (n.at / total) * w;
            const x1 = ((n.at + n.dur) / total) * w;
            const y0 = yHz(n.hz0) * (h - 12) + 6;
            const y1 = yHz(n.hz1) * (h - 12) + 6;
            const op = 0.4 + n.amp * 0.6;
            return (
              '<line x1="' +
              x0 +
              '" y1="' +
              y0 +
              '" x2="' +
              x1 +
              '" y2="' +
              y1 +
              '" stroke="#6b9dff" stroke-width="3" stroke-linecap="round" opacity="' +
              op +
              '" />'
            );
          })
          .join("");
        el.innerHTML =
          '<svg viewBox="0 0 ' +
          w +
          " " +
          h +
          '" preserveAspectRatio="none">' +
          lines +
          "</svg>";
      }

      function render() {
        const list = document.getElementById("list");
        list.innerHTML = "";
        for (const p of LANG.phrases) {
          const b = document.createElement("button");
          b.className = "phrase" + (p.id === selected ? " active" : "");
          b.type = "button";
          b.innerHTML =
            "<strong>" +
            p.id +
            "</strong> — " +
            p.gesture +
            '<span class="meta">' +
            p.meaning +
            " · " +
            p.natural +
            "</span>";
          b.addEventListener("click", () => {
            selected = p.id;
            render();
          });
          list.appendChild(b);
        }
        const phrase = LANG.phrases.find((p) => p.id === selected);
        document.getElementById("pair").textContent =
          phrase.light +
          " · " +
          duration(phrase) +
          " ms · " +
          phrase.pattern;
        drawSpec(phrase);
      }

      function chirp(osc, t0, t1, hz0, hz1) {
        osc.frequency.setValueAtTime(hz0, t0);
        osc.frequency.exponentialRampToValueAtTime(Math.max(hz1, 80), t1);
      }

      function play() {
        const phrase = LANG.phrases.find((p) => p.id === selected);
        const gainMul =
          LANG.profiles[document.getElementById("profile").value];
        const felt = document.getElementById("voice").value === "felt";
        ctx = ctx || new AudioContext();
        if (ctx.state === "suspended") ctx.resume();
        const now = ctx.currentTime;
        const vibrate = [];
        let cursor = 0;
        for (const n of phrase.notes) {
          const osc = ctx.createOscillator();
          const harm = ctx.createOscillator();
          const g = ctx.createGain();
          const gh = ctx.createGain();
          osc.type = "sine";
          harm.type = "sine";
          osc.connect(g);
          harm.connect(gh);
          g.connect(ctx.destination);
          gh.connect(ctx.destination);
          const t0 = now + n.at / 1000;
          const t1 = t0 + n.dur / 1000;
          const a = n.amp * gainMul * (felt ? 0.32 : 0.18);
          if (felt) {
            osc.frequency.setValueAtTime(LANG.lraHz, t0);
            harm.frequency.setValueAtTime(LANG.lraHz * 2, t0);
          } else {
            chirp(osc, t0, t1, n.hz0, n.hz1);
            chirp(harm, t0, t1, n.hz0 * 2, n.hz1 * 2);
          }
          g.gain.setValueAtTime(0, t0);
          g.gain.linearRampToValueAtTime(a, t0 + 0.006);
          g.gain.setValueAtTime(a, Math.max(t0 + 0.006, t1 - 0.014));
          g.gain.linearRampToValueAtTime(0, t1);
          gh.gain.setValueAtTime(0, t0);
          gh.gain.linearRampToValueAtTime(a * 0.14, t0 + 0.006);
          gh.gain.linearRampToValueAtTime(0, t1);
          osc.start(t0);
          harm.start(t0);
          osc.stop(t1 + 0.01);
          harm.stop(t1 + 0.01);
          const gap = n.at - cursor;
          if (gap > 0) vibrate.push(gap);
          vibrate.push(n.dur);
          cursor = n.at + n.dur;
        }
        if (navigator.vibrate) navigator.vibrate(vibrate);
      }

      document.getElementById("play").addEventListener("click", play);
      render();
    </script>
  </body>
</html>
